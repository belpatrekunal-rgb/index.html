<!DOCTYPE html>
<html>
<head>
    <title>Multi Cloud DevOps</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            color: white;
            background: linear-gradient(135deg, #6a11cb, #2575fc, #00c9a7);
            min-height: 100vh;
            padding-top: 60px;
        }

        h1 {
            font-size: 45px;
        }

        h2 {
            font-size: 30px;
        }

        .box {
            background: rgba(255,255,255,0.2);
            padding: 30px;
            margin: 30px auto;
            border-radius: 20px;
            max-width: 500px;
        }

        input {
            padding: 12px;
            border-radius: 8px;
            border: none;
            width: 150px;
        }

        button {
            padding: 12px 20px;
            margin: 10px;
            border: none;
            border-radius: 8px;
            background: #ff9800;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #e68900;
        }
    </style>
</head>

<body>

    <h1>Hello Students! 👋</h1>

    <h2>Multi Cloud DevOps with Kiran Sir</h2>

    <p>Learn AWS • Azure • GCP • DevOps</p>

    <div class="box">

        <h2>🎮 Guess the Number Game</h2>

        <p>Guess a number between 1 and 10</p>

        <input type="number" id="guess" min="1" max="10">

        <br>

        <button onclick="checkGuess()">Check Guess</button>

        <p id="result"></p>

    </div>

    <script>
        let secretNumber = Math.floor(Math.random() * 10) + 1;

        function checkGuess() {

            let guess = Number(document.getElementById("guess").value);

            let result = document.getElementById("result");

            if (guess === secretNumber) {
                result.innerHTML = "🎉 Correct! You won!";
            }
            else if (guess < secretNumber) {
                result.innerHTML = "⬆️ Try a higher number!";
            }
            else {
                result.innerHTML = "⬇️ Try a lower number!";
            }
        }
    </script>

</body>
</html>
